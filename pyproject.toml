[project]
name = "spaninsight"
version = "2.0.0"
description = "Cloud-powered data intelligence platform backed by Google Colab"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flet>=0.86.5",
    "flet-ads>=0.86.5",
    "flet-charts>=0.86.5",
    "flet-audio-recorder>=0.86.5",
    "google-colab-cli>=0.6.0",
    "httpx>=0.27",
    "rich>=15.0.0",
    "orjson==3.11.9",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff",
    "tabfm>=1.0.1",
]

[tool.flet]
org = "com.spaninsight"
product = "Spaninsight"
build_number = 7
desktop_flavor = "full"


[tool.flet.app]
path = "src"

[tool.flet.app.boot_screen]
startup_message = "Connecting to the cloud…"

[tool.flet.android]
bundle_id = "com.spaninsight.app"

[tool.flet.android.manifest_application]
usesCleartextTraffic = "false"

[tool.flet.android.meta_data]
"com.google.android.gms.ads.APPLICATION_ID" = "ca-app-pub-5679949845754640~9586310622"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.ACCESS_NETWORK_STATE" = true
"android.permission.RECORD_AUDIO" = true
"android.permission.WAKE_LOCK" = true

[tool.flet.android.feature]
"android.software.leanback" = false
"android.hardware.touchscreen" = true

[tool.flet.android.signing]
key_store = "../../../../spaninsight_keystore.jks"
key_alias = "upload"

[tool.flet.deep_linking]
scheme = "spaninsight"
host = "app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
lint.extend-ignore = ["BLE001", "S110"]
