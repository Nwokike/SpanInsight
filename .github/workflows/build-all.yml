name: Build Multi-Platform & Create Release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Build version"
        required: true
        default: "2.0.0"
      build_number:
        description: "Build number"
        required: true
        default: "7"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  UV_PYTHON: "3.14"
  BUILD_VERSION: ${{ inputs.build_version || '2.0.0' }}
  BUILD_NUMBER: ${{ inputs.build_number || '7' }}

jobs:
  # ─── 0. Create Release Tag & Placeholder ───────────────
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.tag_info.outputs.TAG_NAME }}
      RELEASE_NAME: ${{ steps.tag_info.outputs.RELEASE_NAME }}
      IS_PRERELEASE: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Release Tag & Name
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=SpanInsight ${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            echo "TAG_NAME=build-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "RELEASE_NAME=Automated Build (${SHORT_SHA})" >> $GITHUB_OUTPUT
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
          fi
      - name: Create GitHub Release Placeholder
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.TAG_NAME }}
          name: ${{ steps.tag_info.outputs.RELEASE_NAME }}
          prerelease: ${{ steps.tag_info.outputs.IS_PRERELEASE }}
          make_latest: true
          body: |
            Automated multi-platform build generated from commit `${{ github.sha }}`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 1. Android APK (split per ABI) ───────────────────────
  build-apk-split:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pre-compile binary wheels (google-colab-cli, primp)
        run: |
          mkdir -p ${{ github.workspace }}/wheels
          pip install wheel
          uv export --no-dev --format requirements-txt | pip wheel -r /dev/stdin --no-deps -w ${{ github.workspace }}/wheels 2>/dev/null || true
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > spaninsight_keystore.jks
      - name: Build APK (split per ABI)
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/spaninsight_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build apk --yes --project spaninsight --product "SpanInsight" --org com.spaninsight --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --split-per-abi --deep-linking-scheme "spaninsight" --deep-linking-host "app" -v
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 2. Android AAB (Play Store) ──────────────────────────
  build-aab:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Pre-compile binary wheels (google-colab-cli, primp)
        run: |
          mkdir -p ${{ github.workspace }}/wheels
          pip install wheel
          uv export --no-dev --format requirements-txt | pip wheel -r /dev/stdin --no-deps -w ${{ github.workspace }}/wheels 2>/dev/null || true
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > spaninsight_keystore.jks
      - name: Build AAB
        env:
          PIP_FIND_LINKS: ${{ github.workspace }}/wheels
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ github.workspace }}/spaninsight_keystore.jks
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: uv run flet build aab --yes --project spaninsight --product "SpanInsight" --org com.spaninsight --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} --deep-linking-scheme "spaninsight" --deep-linking-host "app" -v
      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/aab/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 3. Windows (Automated .exe Setup Installer) ──────────────
  build-windows:
    needs: [prepare-release]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Build Windows Portable
        run: uv run flet build windows --yes --project spaninsight --product "SpanInsight" --org com.spaninsight --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v

      - name: Generate Icon for Installer
        run: |
          uv pip install pillow
          uv run python -c "from PIL import Image; Image.open('src/assets/icon.png').save('src/assets/icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Build Windows Installer (Inno Setup)
        run: |
          $IssContent = @"
          [Setup]
          AppId={{E3D0DAB2-1236-4482-8217-4CFFFB7FDC2C}}
          AppName=SpanInsight
          AppVersion=${{ env.BUILD_VERSION }}
          AppPublisher=Kiri
          AppPublisherURL=https://kiri.ng
          AppSupportURL=https://kiri.ng/support
          AppUpdatesURL=https://kiri.ng/updates
          AppCopyright=Copyright (C) 2026 Kiri
          DefaultDirName={autopf}\SpanInsight
          DefaultGroupName=SpanInsight
          OutputDir=.\build\installer
          OutputBaseFilename=SpanInsight_Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          SetupIconFile=.\src\assets\icon.ico
          UninstallDisplayIcon={app}\spaninsight.exe
          CloseApplications=yes
          AppMutex=SpanInsight_Mutex

          [Files]
          Source: "build\windows\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\SpanInsight"; Filename: "{app}\spaninsight.exe"
          Name: "{autodesktop}\SpanInsight"; Filename: "{app}\spaninsight.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"; Flags: unchecked
          "@
          Set-Content -Path "installer.iss" -Value $IssContent -Encoding UTF8
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/installer/SpanInsight_Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 4. Linux (.deb, .rpm & Universal .tar.gz) ────────────────
  build-linux:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Linux Build Dependencies & Packaging Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev rpm ruby ruby-dev
          sudo gem install --no-document fpm
      - name: Build Linux Bundle
        run: uv run flet build linux --yes --project spaninsight --product "SpanInsight" --org com.spaninsight --build-version ${{ env.BUILD_VERSION }} --build-number ${{ env.BUILD_NUMBER }} -v
      - name: Create Linux Packages (.deb, .rpm, .tar.gz)
        run: |
          mkdir -p build/dist

          # 1. Universal Portable .tar.gz
          tar -czf build/dist/SpanInsight_${{ env.BUILD_VERSION }}_linux_x86_64.tar.gz -C build/linux .

          # 2. Stage filesystem tree for rich .deb and .rpm packages
          mkdir -p pkg_root/usr/lib/spaninsight pkg_root/usr/bin pkg_root/usr/share/applications pkg_root/usr/share/icons/hicolor/256x256/apps pkg_root/usr/share/pixmaps pkg_root/usr/share/metainfo
          cp -a build/linux/* pkg_root/usr/lib/spaninsight/
          chmod +x pkg_root/usr/lib/spaninsight/spaninsight
          ln -s /usr/lib/spaninsight/spaninsight pkg_root/usr/bin/spaninsight

          # Icons (both hicolor and pixmaps ensure instant icon display when opening .deb file in Ubuntu App Center before installation)
          cp src/assets/icon.png pkg_root/usr/share/icons/hicolor/256x256/apps/spaninsight.png
          cp src/assets/icon.png pkg_root/usr/share/pixmaps/spaninsight.png

          # Desktop entry
          cat <<EOF > pkg_root/usr/share/applications/spaninsight.desktop
          [Desktop Entry]
          Version=1.0
          Name=SpanInsight
          GenericName=Cloud Data Intelligence Platform
          Comment=Collect data, analyze on Colab GPUs/TPUs, and publish autonomous reports
          Exec=/usr/bin/spaninsight
          Icon=spaninsight
          Terminal=false
          Type=Application
          Categories=Office;Science;DataVisualization;
          Keywords=Data;Analysis;Colab;AI;Reports;Surveys;
          StartupNotify=true
          StartupWMClass=spaninsight
          EOF

          # AppStream / AppData metainfo XML (rich preview information in Ubuntu App Center & GNOME Software)
          cat <<EOF > pkg_root/usr/share/metainfo/com.spaninsight.app.metainfo.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>com.spaninsight.app</id>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <name>SpanInsight</name>
            <summary>Cloud-powered data intelligence platform backed by Google Colab</summary>
            <description>
              <p>SpanInsight is a high-performance data intelligence platform that provides:</p>
              <ul>
                <li>Google Colab cloud execution on CPU, T4 GPU, and TPU v5e/v6e runtimes</li>
                <li>Autonomous Autopilot that formulates hypotheses and compiles full reports</li>
                <li>Self-healing code execution with AI-driven traceback repair</li>
                <li>Smart voice surveys, interactive file explorer, and live web report sharing</li>
              </ul>
            </description>
            <launchable type="desktop-id">spaninsight.desktop</launchable>
            <url type="homepage">https://kiri.ng</url>
            <developer_name>Kiri</developer_name>
          </component>
          EOF

          # Build rich .deb using fpm
          fpm -s dir -t deb -n spaninsight -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture amd64 \
              --description "Cloud-powered data intelligence platform backed by Google Colab." \
              --maintainer "Kiri <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "utils" \
              -p build/dist/SpanInsight_${{ env.BUILD_VERSION }}_amd64.deb \
              -C pkg_root .

          # Build rich .rpm using fpm
          fpm -s dir -t rpm -n spaninsight -v ${{ env.BUILD_VERSION }} --iteration ${{ env.BUILD_NUMBER }} \
              --architecture x86_64 \
              --description "Cloud-powered data intelligence platform backed by Google Colab." \
              --maintainer "Kiri <support@kiri.ng>" \
              --url "https://kiri.ng" \
              --category "Utility" \
              -p build/dist/SpanInsight_${{ env.BUILD_VERSION }}_x86_64.rpm \
              -C pkg_root .

      - name: Upload directly to GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.TAG_NAME }}
          files: build/dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
